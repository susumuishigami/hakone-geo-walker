# =============================================================================
# Sync from private dev repo to this Public repo
# =============================================================================
# 開発リポジトリ (susumuishigami/hakone-geo-walker-dev) の指定タグの内容を
# この公開リポジトリへ取り込み、同名のタグを打つ。
#
# 2リポジトリ構成の背景と、リリースの中でこれを実行するタイミングは Wiki にある。
#   https://github.com/susumuishigami/hakone-geo-walker/wiki/開発リポジトリ-と-公開リポジトリ
#   https://github.com/susumuishigami/hakone-geo-walker/wiki/リリース手順
# =============================================================================

name: Sync from private

on:
  workflow_dispatch:
    inputs:
      # 前後空白は自動除去。v 無しなら自動で v を付与
      # 開発リポジトリに既に存在するタグ名を指定すること
      version:
        description: '開発リポジトリのタグ名 (例: 0.1, v0.2.1, 1.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: sync-from-private
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public (this repo)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Normalize version input
        id: version
        env:
          RAW_VERSION: ${{ inputs.version }}
        run: |
          stripped="$(printf '%s' "$RAW_VERSION" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [ -z "$stripped" ]; then
            echo "::error::version input is required (after stripping whitespace)"
            exit 1
          fi
          case "$stripped" in
            v*) ;;
            *)  stripped="v$stripped" ;;
          esac
          echo "Tag: '$stripped'"
          echo "value=$stripped" >> "$GITHUB_OUTPUT"

      - name: Verify tag does not already exist on Public
        env:
          TAG: ${{ steps.version.outputs.value }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag '$TAG' already exists locally on Public. Delete it first or pick a different version."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag '$TAG' already exists on Public remote. Delete it first or pick a different version."
            exit 1
          fi

      - name: Setup SSH for private repo access
        env:
          PRIVATE_REPO_DEPLOY_KEY: ${{ secrets.PRIVATE_REPO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$PRIVATE_REPO_DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<'EOF'
          Host github-private
            HostName github.com
            User git
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Clone private repo at tag
        env:
          TAG: ${{ steps.version.outputs.value }}
        run: |
          git clone --depth=1 --branch="$TAG" \
            git@github-private:susumuishigami/hakone-geo-walker-dev.git \
            /tmp/private
          echo "PRIVATE_SHA=$(git -C /tmp/private rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Rsync private -> public (with excludes)
        run: |
          # 除外を追加・変更したら、開発リポジトリの CLAUDE.md にある置き場所の
          # 案内も合わせて直すこと。
          rsync -avc --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            --exclude='.gitignore' \
            --exclude='data/private/' \
            --exclude='CLAUDE.md' \
            --exclude='AGENTS.md' \
            --exclude='.claude/' \
            --exclude='scratch/' \
            --exclude='notes/' \
            --exclude='memo/' \
            --exclude='.private/' \
            --exclude='*.draft.md' \
            --exclude='*.wip.md' \
            /tmp/private/ ./

      - name: Commit & push if changes
        env:
          TAG: ${{ steps.version.outputs.value }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to sync (Public already matches Private $TAG)."
          else
            git commit -m "Sync $TAG from private (${PRIVATE_SHA})"
            git push origin HEAD:main
          fi

      - name: Create and push tag
        env:
          TAG: ${{ steps.version.outputs.value }}
        run: |
          git tag -a "$TAG" -m "Release $TAG (synced from private ${PRIVATE_SHA})"
          git push origin "refs/tags/$TAG"
          echo "Created tag: $TAG"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/config
